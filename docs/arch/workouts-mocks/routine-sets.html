<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body { width: 1780px; flex-wrap: wrap; }
.col { display:flex; flex-direction:column; gap:6px; }
.cap2 { color:#fff; font-size:12px; font-weight:600; margin:0 6px; max-width: 390px; min-height: 30px; }
.phone { height: 844px; }
.ex { background: var(--bg2); border-radius: 12px; overflow: hidden; }
.exHead { display:flex; align-items:center; gap:12px; padding: 14px 16px; min-height: 60px; }
.handle { color: var(--text3); font-size: 18px; width: 20px; text-align:center; }
.exText { flex:1; min-width:0; } .exName { font-size: 17px; font-weight: 600; } .exSum { font-size: 13px; color: var(--text2); margin-top: 3px; line-height: 18px; }
.chev { color: var(--text3); font-size: 15px; }
.body { border-top: 0.5px solid var(--sep); padding: 12px 0 20px; }
.th, .tr { display:grid; grid-template-columns: 52px 1fr 1fr; align-items:center; padding: 0 16px 0 8px; column-gap: 8px; }
.th { font-size: 11px; font-weight:600; letter-spacing: 0.8px; color: var(--text3); padding-bottom: 6px; }
.tr { min-height: 52px; border-top: 0.5px solid var(--sep); font-size: 17px; font-variant-numeric: tabular-nums; }
.badge { justify-self:center; min-width: 36px; height: 32px; border-radius: 8px; display:flex; align-items:center; justify-content:center; font-weight: 700; font-size: 15px; color: var(--text2); background: var(--bg3); }
.badge.w { color: var(--orangeText); } .badge.f { color: var(--accentText); } .badge.d { color: var(--orangeText); }
.cell { justify-self: start; min-width: 72px; height: 36px; padding: 0 12px; border-radius: 8px; display:flex; align-items:center; background: var(--bg3); }
.cell.dim { color: var(--text3); font-size: 15px; }
.cell.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.adds { display:flex; gap:8px; flex-wrap:wrap; padding: 14px 16px 0; border-top: 0.5px solid var(--sep); }
.pill.red { background: rgba(209,11,0,0.1); color: #C00A00; } .dark .pill.red { background: rgba(255,89,79,0.16); color: #FF7A72; }
.scrim { position:absolute; inset:0; background: rgba(0,0,0,0.32); }
.dark .scrim { background: rgba(0,0,0,0.5); }
.pop { position:absolute; background: var(--bg2); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); overflow:hidden; }
.dark .pop { background: var(--bg3); }
.menuRow { display:flex; align-items:center; gap: 12px; padding: 12px 16px; font-size: 17px; min-width: 220px; }
.menuRow + .menuRow { border-top: 0.5px solid var(--sep); }
.menuRow .mb { width: 22px; text-align:center; font-weight:700; font-size: 15px; }
.menuRow .tick { margin-left:auto; color: var(--accentText); font-weight:700; }
.menuRow.red { color: #C00A00; } .dark .menuRow.red { color: #FF7A72; }
.menuGap { height: 8px; background: var(--sep); opacity: .5; }
.popPad { padding: 16px; display:flex; flex-direction:column; gap: 14px; min-width: 250px; }
.popTitle { font-size: 15px; font-weight: 600; }
.pk { display:flex; align-items:center; justify-content:space-between; gap: 16px; }
.pk .l { font-size: 15px; color: var(--text2); }
.dark .pop .stepper { background: var(--bg2); }
.link { color: var(--accentText); font-size: 15px; }
/* option B */
.tr.open { background: var(--sunken); }
.edB { background: var(--sunken); padding: 0 16px 6px; }
.edB .r { display:flex; align-items:center; justify-content:space-between; min-height: 52px; gap: 12px; }
.edB .r + .r { border-top: 0.5px solid var(--sep); }
.edB .l { font-size: 15px; color: var(--text2); }
.edB .seg { flex: 1; }
.dark .edB .seg { background: var(--bg2); } .dark .edB .stepper { background: var(--bg2); }
.edB .stepper { background: var(--bg2); }
.light .edB .seg span.on { background: var(--bg2); }
.trB { display:grid; grid-template-columns: 44px 1fr 1fr 20px; align-items:center; padding: 0 16px; column-gap: 8px; min-height: 48px; border-top: 0.5px solid var(--sep); font-size: 17px; }
.trB .n { text-align:center; font-weight:600; color: var(--text2); font-size: 15px; } .trB .b { text-align:center; font-weight:700; font-size: 15px; }
.thB { display:grid; grid-template-columns: 44px 1fr 1fr 20px; padding: 0 16px 6px; column-gap: 8px; font-size: 11px; font-weight:600; letter-spacing:.8px; color: var(--text3); }
.textAct { color: #C00A00; font-size: 15px; } .dark .textAct { color: #FF7A72; }
.note { color:#fff; font-size:12px; line-height:1.45; width: 1720px; margin-top: 4px; }
</style></head><body>
<script>
const st = (v) => `<span class="stepper"><b>−</b><i>${v}</i><b>+</b></span>`;
const head = (sum) => `<div class="status"><span>7:29</span><span>●●●</span></div>
  <div class="sheetHeader"><span class="side">Cancel</span><span class="title">New routine</span><span class="side r">Save</span></div>`;
const exHead = `<div class="exHead"><span class="handle">═</span><div class="exText"><div class="exName">Bench press</div><div class="exSum">1 warm-up · 3 × 6–8 · 1 to failure · rest 2:30</div></div><span class="chev">⌃</span></div>`;
const rowsA = [
  ['w','W','40','10'],
  ['','1','80','6–8'],
  ['','2','80','6–8'],
  ['','3','80','6–8'],
  ['f','F','70','8+'],
];
function tableA(sel) {
  let out = `<div class="th"><span style="text-align:center">SET</span><span style="padding-left:2px">KG</span><span style="padding-left:2px">REPS</span></div>`;
  rowsA.forEach((r, i) => {
    out += `<div class="tr"><span class="badge ${r[0]}">${r[1]}</span><span class="cell ${sel && sel[0]===i && sel[1]==='kg'?'sel':''}">${r[2]}</span><span class="cell ${sel && sel[0]===i && sel[1]==='reps'?'sel':''}">${r[3]}</span></div>`;
  });
  out += `<div class="adds"><span class="pill">+ Add set</span><span class="pill neutral">+ Warm-up</span></div>`;
  return out;
}
function optionA(theme, popover, sel) {
  return `<div class="phone ${theme}">${head()}
  <div class="scroll">
    <div class="groupLabel" style="margin-top:8px">Exercises</div>
    <div class="ex">${exHead}<div class="body">${tableA(sel)}</div></div>
  </div>${popover ? '<div class="scrim"></div>' + popover : ''}</div>`;
}
const typeMenu = `<div class="pop" style="left:40px; top:470px">
  <div class="menuRow"><span class="mb" style="color:var(--orangeText)">W</span>Warm-up</div>
  <div class="menuRow"><span class="mb" style="color:var(--text2)">2</span>Working<span class="tick">✓</span></div>
  <div class="menuRow"><span class="mb" style="color:var(--orangeText)">D</span>Drop set</div>
  <div class="menuRow"><span class="mb" style="color:var(--accentText)">F</span>To failure</div>
  <div class="menuGap"></div>
  <div class="menuRow"><span class="mb">⧉</span>Duplicate set</div>
  <div class="menuRow red"><span class="mb">🗑︎</span>Remove set</div>
</div>`;
const repsPop = `<div class="pop" style="left:110px; top:520px"><div class="popPad">
  <div class="popTitle">Set 3 reps</div>
  <div class="pk"><span class="l">From</span>${st('6')}</div>
  <div class="pk"><span class="l">To</span>${st('8')}</div>
</div></div>`;
const kgPop = `<div class="pop" style="left:60px; top:300px"><div class="popPad">
  <div class="popTitle">Set 1 weight</div>
  <div class="pk">${st('80 kg')}<span class="link">Last time</span></div>
</div></div>`;
function optionB(theme) {
  const r = (b, cls, kg, reps, chev) => `<div class="trB ${chev==='⌃'?'open':''}"><span class="${cls}">${b}</span><span>${kg}</span><span>${reps}</span><span class="chev">${chev}</span></div>`;
  return `<div class="phone ${theme}">${head()}
  <div class="scroll">
    <div class="groupLabel" style="margin-top:8px">Exercises</div>
    <div class="ex">${exHead}<div class="body">
      <div class="thB"><span style="text-align:center">SET</span><span>KG</span><span>REPS</span><span></span></div>
      ${r('W','b" style="color:var(--orangeText)','40','10','⌄')}
      ${r('1','n','80','6–8','⌄')}
      ${r('2','n','80','6–8','⌃')}
      <div class="edB">
        <div class="r"><div class="seg" style="width:100%"><span>Warm-up</span><span class="on">Working</span><span>Drop</span><span>Failure</span></div></div>
        <div class="r"><span class="l">Weight</span>${st('80 kg')}</div>
        <div class="r"><span class="l">Reps</span><span style="display:flex;gap:6px;align-items:center">${st('6')}<span class="l">to</span>${st('8')}</span></div>
        <div class="r"><span class="link">Duplicate</span><span class="textAct">Remove set</span></div>
      </div>
      ${r('3','n','80','6–8','⌄')}
      ${r('F','b" style="color:var(--accentText)','70','8+','⌄')}
      <div class="adds"><span class="pill">+ Add set</span><span class="pill neutral">+ Warm-up</span></div>
    </div></div>
  </div></div>`;
}
document.body.innerHTML =
  `<div class="col"><div class="cap2">A. Nothing expands: each cell is its own button (dark)</div>${optionA('dark', '', null)}</div>` +
  `<div class="col"><div class="cap2">A. Tap the set's badge: its type, duplicate, remove</div>${optionA('dark', typeMenu, null)}</div>` +
  `<div class="col"><div class="cap2">A. Tap a reps cell (light; a KG cell opens one stepper and "Last time")</div>${optionA('light', repsPop, [3,'reps'])}</div>` +
  `<div class="col"><div class="cap2">B. For comparison: the panel tidied into rows, with the type on one line</div>${optionB('dark')}</div>` +
  `<div class="note">Proxy mock of layout only (CSS, not the app). A is the pattern Strong and Hevy use: the table never changes shape, and every edit is a small card that opens from what you tapped (the same popover Today's "…" menu uses), so you can see the other sets while you change one. B keeps the earlier opening panel but lays it out as label-and-control rows. Cool-down is gone; the four types fit in one line. The rest of the exercise (ramped warm-ups, rest, progression, superset, remove) stays as in the previous mock.</div>`;
</script>
</body></html>
