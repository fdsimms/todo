name: Tests

on:
  pull_request:
  # Also on main, because the generated-doc checks are only as good as the
  # branch everything is cut from. Nothing checked main, so a merge that
  # landed a new export without regenerating docs/module-map.md left main
  # stale — and every branch cut from it afterwards inherited the staleness
  # and failed a check it hadn't caused. That is what makes one missed
  # regeneration read as "CI is broken" rather than as one red PR.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR pushes are worth cancelling. A run on main is the check
  # that says whether main itself is green, and merges land seconds apart, so
  # cancelling those meant a merge that broke main had its run killed by the
  # next merge and never showed red. Several main runs are `cancelled` rather
  # than failed for exactly that reason, which is how main sat stale on both
  # generated-doc checks while every branch cut from it inherited the failure.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ahead of the tests because it's the faster of the two and catches a
      # different class of thing: a duplicate object key in a fixture is
      # invisible to Jest (last one wins) and a compile error here. This is the
      # first half of the verification loop CLAUDE.md asks for, and it went
      # unenforced long enough for main to merge red on it.
      - run: npx tsc --noEmit
      # The standard hosted runner has two cores, and Jest's default is one
      # worker fewer than that — so without this the whole suite runs in a
      # single worker and CI pays the sum of every file rather than the longest
      # one. Local runs keep the default.
      - run: npm test -- --maxWorkers=2
      # The demo-seed blocks in this file share one seeded database across all
      # the tests in each block, which is only correct while none of them
      # writes — and a test that starts writing still passes in declaration
      # order, so the ordinary run above cannot catch it. Randomised order can,
      # and did: it is what caught a real ordering bug in the change that
      # introduced the sharing. Scoped to this one file on purpose, because the
      # rest of the suite is not order-independent yet and would fail here for
      # reasons no pull request caused.
      - run: npx jest src/__tests__/useDemoStore.test.ts --randomize
      # The two docs that are generated from the tree rather than written by
      # hand. Both are committed so an agent can read them without running a
      # build; these checks are what stops them going stale the way the
      # hand-counted "seven files are over 1,000 lines" paragraph did.
      - run: node scripts/build-module-map.js --check
      - run: node scripts/check-doc-stats.js --check
      # The third generated doc: which screen renders which component, and
      # which screens a component appears on. Same contract as the two above —
      # generated from the tree, committed so it can be read without a build,
      # and checked here so it cannot drift.
      - run: node scripts/build-screen-map.js --check
      # `expo export --platform ios` is the slowest step here and only catches
      # bundle-time breakage (a bad import path, a missing asset, a native
      # config change) per CLAUDE.md's own guidance not to run it locally
      # otherwise. Most PRs touch neither, so on PRs it's gated to the paths
      # that can actually cause that class of failure — the CI minutes for a
      # doc tweak or a one-line logic fix were otherwise identical to a
      # native-config change. Push to main always runs it as the safety net:
      # that's the build every branch gets cut from next.
      - name: Check for bundle-relevant changes
        if: github.event_name == 'pull_request'
        id: bundle-paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bundle:
              - 'package.json'
              - 'package-lock.json'
              - 'app.json'
              - 'eas.json'
              - 'patches/**'
              - 'plugins/**'
              - 'modules/**'
              - 'targets/**'
              - 'assets/**'
      - if: github.event_name != 'pull_request' || steps.bundle-paths.outputs.bundle == 'true'
        run: npx expo export --platform ios --output-dir /tmp/expo-export
        env:
          CI: 1
